<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@3.6.5/dist/vue-router.js"></script>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      background-color: #f5d5e7bc;
    }


    /* 第一页面 */
    .download-box{
      width: 420px;
      background-image:
      linear-gradient(rgba(255,255,255,0.4)),
      url('./background-picture.jpg');
      background-position:top center;
      background-size:100% auto;
      margin: 120px auto;
      padding: 45px 35px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      position:relative;
    }
    .rectangle1{
        display:block;
        margin:0 auto;
        background-color:#fff;
        height:40px;
        width:100px;
        border-radius: 10px;
    }
    .download-box h2{
      height:40px;
      text-align: center;
      color: #eabde4;
      margin-bottom: 30px;
    }
    .input-box{
      margin-bottom: 22px;
    }
    .rectangle2{
        background-color:#fff;
        height:25px;
        width:45px;
        border-radius:10px;
    }
    .input-box label{
      display: block;
      margin-bottom: 6px;
      color:#eabde4;
      text-align: center;
    }
    .input-box input{
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 2px solid #eabde4;
      border-radius: 6px;
      font-size: 15px;
    }
    .input-box input:focus{
      outline: none;
      border-color: #f6f9d2;
    }
    .download-button{
      width: 100%;
      height: 44px;
      background-color: #e8b7e9;
      color:#fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .download-button:hover{
      background-color: #d8b6d9;
    }
    .check{
      margin-top:16px;
      text-align:center;
      color:#f47676;
      font-size:18px;
      font-weight:600;
    }
    .kitty{
      width:115px;
      position:absolute;
      top:-45px;
      left:0;
      z-index:99;
      transform-origin:center center;  /* 使图片中心为旋转点 */
    }


    /*第二页面*/
    .nav{
      width:100%;
      height:60px;
      background-color:pink;
      position:fixed;
      top:0;
      left:0;
      align-items:center;
      justify-content:center;
      display:flex;
      padding:0 20px;
      z-index:999;
    }
    .nav-text{
      font-size:25px;
      font-weight:700;
      color:#effba4;
    }
    .out-button{
      position:absolute;
      right:20px;
      background-color:rgb(178, 223, 240);
      width:60px;
      height:33px;
      border:1px solid rgb(255, 255, 255);
      border-radius:10px;
      font-size:12px;
      color:white;
      cursor:pointer;
    }
    .container{
      padding-top:80px;
      max-width:900px;
      margin:0 auto;
      padding-left:20px;
      padding-right:20px;
    }
    .search{
      width:100%;
      border:1px solid yellow;
      border-radius:10px;
      padding:0 10px;
      margin-bottom:20px;
      font-size:16px;
      height:47px;
    }
    .card-box{
      margin-bottom:100px;
    }
    .card{
      width:100%;
      height:220px;
      position:relative;
      perspective:1200px;
    }
    .first,.second{
      width:100%;
      height:100%;
      padding:24px;
      border-radius:20px;
      border:2px solid rgb(252,249,211);
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
      position:absolute;
      left:0;
      top:0;
      backface-visibility:hidden;
      transition:transform 0.7s ease;
      display:flex;
      align-items:center;
      gap:50px;
    }
    .first{
      transform:rotateY(0deg);
    }
    .second{
      transform:rotateY(180deg);
      justify-content:center;
    }
    .card:hover .first{
      transform:rotateY(-180deg);
    }
    .card:hover .second{
      transform:rotateY(0deg);
    }
    .firstimg{
      width:140px;
      height:140px;
      object-fit:cover;
      border-radius:12px;
      flex-shrink:0;
    }
    .text{
      flex:1;
    }
    .text h3{
      color:#c888c7;
      margin-bottom:8px;
      font-size:28px;
      text-align:center;
    }
    .text p{
      line-height:1.7;
      font-size:16px;
    }
    .secondimg{
      width:200px;
      height:200px;
      object-fit:cover;
      border-radius:16px;
    }
    .card-box:nth-child(even) .first{
      flex-direction:row-reverse;
    }
    .top{
      position:fixed;
      width:60px;
      height:60px;
      border:none;
      border-radius:50%;
      background-color:pink;
      color:rgb(251, 249, 251);
      font-size:14px;
      bottom: 20px;
      right:20px;
      z-index:999;
      cursor:pointer;
    }
    /* 媒体查询 */
    @media (max-width:1100px){
      .card{
        height:420px;
      }
      .first,.second{
        flex-direction:column;
        justify-content:center;
        gap:24px;
      }
      .card-box:nth-child(even) .first{
        flex-direction:column;
      }
      .firstimg{
        width:120px;
        height:120px;
      }
      .secondimg{
        width:160px;
        height:160px;
      }
      .text h3{
        font-size:24px;
      }
    }
    @media (max-width:768px){
      .card{
        height:440px;
      }
      .nav-text{
        font-size:18px;
      }
      .out-button{
        width:50px;
        height:28px;
        font-size:10px;
        right:10px;
      }
      .firstimg{
        width:100px;
        height:100px;
      }
      .secondimg{
        width:130px;
        height:130px;
      }
      .text h3{
        font-size:20px;
      }
      .text p{
        font-size:14px;
      }
      .top{
        width:45px;
        height:45px;
        font-size:12px;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <router-view></router-view>
</div>

<script>


//第一页面
const Login = {
  data() {
    return {
      username: '',
      password: '',
      message: '',
      x:0,//当前图片水平方向的位置
      rightX:0,//图片的最右边的距离
      leftX:0,//图片的最左边距离
      directionX:1,//移动方向，向右为1，向左为-1
      speedX:1.5,//每一次定时器移动的像素
      angle:-10,//图片的初始旋转角度
      speedAngle:1.2,//每一次定时器旋转多少度
      directionAngle:1//旋转方向，顺时针为1，-1为逆时针
    }
  },
  mounted(){
    this.number=setInterval(()=>{
      const img=this.$refs.kittyimg;
      if(!img) return;
      const downloadWidth=img.parentElement.offsetWidth;
      this.rightX=downloadWidth-img.offsetWidth;
      //水平移动
      this.x+=this.directionX*this.speedX;
      if(this.x>=this.rightX){
        this.x=this.rightX;
        this.directionX=-1;
      }
      if(this.x<=this.leftX){
        this.x=this.leftX;
        this.directionX=1;
      }
      //旋转逻辑
      this.angle+=this.speedAngle*this.directionAngle;
      if(this.angle>=10){
        this.angle=10;
        this.directionAngle=-1;
      }
      if(this.angle<=-10){
        this.angle=-10;
        this.directionAngle=1;
      }
      //实现同时平移和旋转的效果
      img.style.transform=`translateX(${this.x}px) rotate(${this.angle}deg)`;
    },48)
  },
  beforeDestroy(){
    clearInterval(this.number);
  },
  methods: {
    handleLogin() {
      if (!this.username) {
        this.message = '请输入账号'
        return
      }
      if (!this.password) {
        this.message = '请输入密码'
        return
      }
      const mima=this.password;
      const letter=/[a-zA-Z]/.test(mima);
      const number=/[0-9]/.test(mima);
      if(mima.length<6){
        this.message='密码长度必须至少6位！'
        return;
      }
      if(!letter){
        this.message='密码必须包含英文字母!'
        return;
      }
      if(!number){
        this.message='密码必须包含数字'
        return;
      }
      this.message = '登录成功'
      //切换到第二个页面
      this.$router.push('/works')
    }
  },
  template:`
  <div>
    <div class="download-box">
      <img ref="kittyimg" class="kitty" src="./kitty.png">
      <h2 class="rectangle1">账号登录</h2>
      <div class="input-box">
        <label class="rectangle2">账号</label>
        <input v-model="username" type="text" placeholder="请输入账号">
      </div>
      <div class="input-box">
        <label class="rectangle2">密码</label>
        <input v-model="password" type="password" placeholder="请输入包含英文和数字的不少于六位的密码">
      </div>
      <button class="download-button" @click="handleLogin">登录</button>
      <div class="check">{{ message }}</div>
    </div>
</div>
  `
}

//第二页面
const show={
  data(){
    return{
      searchText:'',//搜索框绑定数据
      showBackTop:false,//是否显示回到顶部按钮
      list:[
        {
          name:"美乐蒂",
          text:"My Melody是一只温柔软萌的粉色小白兔，头顶标志性的粉色蝴蝶结是她最大的特色。她性格善良体贴、天真纯粹，待人温柔又有礼貌，总是带着治愈的笑容。生活在梦幻可爱的马里兰乐园里，喜欢鲜花、甜点与一切粉色温柔的事物，热爱帮助身边的小伙伴，是乐园里最温暖治愈的小天使。",
          img:"./meiledi.jpeg" 
        },
        {
          name:"库洛米",
          text:"Kuromi 是戴着黑色头巾的俏皮小兔子，自带酷飒又傲娇的反差萌外表。看似高冷叛逆、气场十足，实际上内心细腻柔软、十分可爱。作为美乐蒂的欢喜冤家，平时喜欢和她打闹拌嘴，但在关键时刻总会默默守护朋友。个性直率独立，喜欢收集黑色系的精致小饰品，有着外冷内热的迷人性格。",
          img:"./kuluomi.jpeg"
        },
        {
          name:"玉桂狗",
          text:"Cinnamoroll 是一只干净温柔的白色长耳小狗，通体雪白柔软，长长的耳朵轻盈灵动、可以乘风飞翔，蓬松的尾巴像甜甜的肉桂卷。他性格安静腼腆、温柔乖巧，性格细腻又治愈，不喜欢争抢吵闹。总是安静陪伴在伙伴身边，温柔又治愈，是治愈系满满的温柔小可爱。",
          img:"./yuguigou.webp"
        },
        {
          name:"帕恰狗",
          text:"Pochacco 是一只干净清爽的白色小狗，自带阳光元气气质。性格活泼开朗、热爱运动，最喜欢踢足球和户外活动，精力充沛、积极向上。性格善良大方、待人热情，喜欢和小伙伴一起玩耍打闹，永远充满活力与朝气，是团队里最阳光活泼的元气少年。",
          img:"./paqiagou.jpeg"
        },
        {
          name:"布丁狗",
          text:"Pom Pom Purin 是一只软乎乎的金黄色小狗，外形像香甜软糯的布丁，治愈感十足。性格慵懒温柔、佛系又随和，最大的爱好就是晒太阳、午睡和悠闲度日。性格不争不抢、温柔敦厚，脾气超级好，待人温顺友善，是慵懒又治愈的温柔小可爱。",
          img:"./budinggou.jpeg"
        },
        {
          name:"HelloKitty",
          text:"Hello Kitty 是经典的圆脸蛋白色小猫，红色蝴蝶结是她独一无二的标志性装饰。性格温柔乖巧、天真善良，热爱生活、喜欢烘焙甜点、制作可爱小物件。待人真诚友善，喜欢结交新朋友，温柔有礼貌、干净治愈，是温柔甜美、永远治愈人心的经典小可爱。",
          img:"./kitty.jpeg"
        },
        {
          name:"山姆企鹅",
          text:"Tuxedo Sam 是一只优雅绅士的小企鹅，总是穿着整洁精致的小礼服，气质温柔儒雅。性格彬彬有礼、温柔绅士，待人谦和有礼貌，举止优雅大方。温柔稳重、气质绝佳，自带温柔贵气的感觉，是优雅又乖巧的绅士小企鹅。",
          img:"./qier.jpeg"
        }
      ]
    }
  },
  computed:{
   filterList(){
    //如果搜索框为空，返回全部角色
    if(!this.searchText.trim()){
      return this.list;
    }
    //保留名字包含输入文字的角色
    return this.list.filter(item=>{
      return item.name.includes(this.searchText)
    })
   }
  },
mounted(){
    this.scrollFn = ()=>{
    this.handleScroll()
  }
  window.addEventListener('scroll', this.scrollFn)
},
beforeDestroy(){
  window.removeEventListener('scroll', this.scrollFn)
},
  methods:{
    handleScroll(){
      //scrollY>0说明页面不在顶部，显示回顶部的按钮
      this.showBackTop=window.scrollY>0;
    },
    backTop(){
      window.scrollTo({
        top:0,
        behavior:'smooth'
      })
    },
    out(){
      this.$router.push('/login')
    }
  },
  template:`
  <div>
    <div class="nav">
      <div class="nav-text">三丽鸥角色介绍</div>
      <button class="out-button" @click="out">退出登录</button>
    </div>
    <div class="container">
      <input class="search" v-model="searchText" placeholder="请输入角色名称搜索">
      <div class="card-box" v-for="item in filterList" :key="item.name">
        <div class="card">
         <div class="first">
          <img class="firstimg" :src="item.img" alt="">
          <div class="text">
            <h3>{{item.name}}</h3>
            <p>{{item.text}}</p>
          </div>
         </div>
        <div class="second">
          <img class="secondimg" :src="item.img" alt="">
        </div>
      </div>  
    </div>
  </div>  
    <button v-show="showBackTop" class="top" @click="backTop">回到顶部</button>
  </div>
  `
}

const routes = [
  { path:'/', redirect:'/login' },
  { path:'/login', component: Login },
  { path:'/works', component: show }
]
const router = new VueRouter({routes})

new Vue({
  el:'#app',
  router
})
</script>
</body>
</html>
